name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - codex-github-pages-no-vite
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble static Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -R fonts _site/fonts
          cp -R public _site/public
          cp -R src _site/src
          cp -R stylesheet _site/stylesheet

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
